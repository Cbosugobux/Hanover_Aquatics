<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swim Club All-Time Top 10</title>
  <link rel="stylesheet" href="Static/style.css" />
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <img id="club-logo" alt="" style="display:none" />
      <h1 id="club-heading">ALL-TIME TOP 10 TIMES</h1>
    </header>
    <main class="content"><div class="content-inner">
      <form id="filter-form">
        <div class="form-group"><label for="course">Course</label><select id="course"></select></div>
        <div class="form-group"><label for="gender">Category</label><select id="gender"></select></div>
        <div class="form-group"><label for="age_group_desc">Age Group</label><select id="age_group_desc"></select></div>
        <div class="form-group"><label for="event">Event</label><select id="event"></select></div>
      </form>
      <table><thead><tr><th>Rank</th><th>Name</th><th>Swim Time</th><th>Date</th><th>Meet</th></tr></thead><tbody id="results-table"><tr><td colspan="5" style="text-align:center">Loading…</td></tr></tbody></table>
    </div></main>
    <footer><p>All-Time Top 10</p></footer>
  </div>
  <script src="top10_dashboard.js" defer></script>
</body>
</html>
