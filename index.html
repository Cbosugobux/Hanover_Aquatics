<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="theme-color"
    content="#111111"
  />

  <title>
    Hanover Aquatics All-Time Top 10
  </title>

  <!--
    Increment the version whenever style.css changes.
    This helps force Safari/iPhone to load the new CSS.
  -->
  <link
    rel="stylesheet"
    href="Static/style.css?v=6"
  />
</head>


<body>

  <div class="wrapper">


    <!-- =====================================================
         CLUB HEADER
         ===================================================== -->

    <header class="header">

      <img
        id="club-logo"
        class="club-logo"
        src="Static/HNVR_LOGO_TRANSPARENT.svg"
        alt="Hanover Aquatics Hurricanes logo"
      />

      <div class="header-copy">

        <p class="club-eyebrow">
          HANOVER AQUATICS
        </p>

        <h1 id="club-heading">
          ALL-TIME TOP 10 TIMES
        </h1>

      </div>

    </header>


    <!-- =====================================================
         PRIMARY SITE NAVIGATION

         Same three navigation choices should appear on:
           index.html
           records_scy.html
           records_lcm.html

         Current page receives class="active".
         ===================================================== -->

    <nav
      class="record-links site-nav"
      aria-label="Hanover Aquatics times and records"
    >

      <a
        href="index.html"
        class="active"
        aria-current="page"
      >
        Top 10
      </a>

      <a href="records_scy.html">
        SCY Records
      </a>

      <a href="records_lcm.html">
        LCM Records
      </a>

    </nav>


    <!-- =====================================================
         MAIN CONTENT
         ===================================================== -->

    <main class="content">

      <div class="content-inner">


        <!-- =================================================
             FILTER PANEL

             DESKTOP:
               4 across

             TABLET:
               2 x 2

             MOBILE:
               1 column
             ================================================= -->

        <section
          class="filter-panel"
          aria-label="Top 10 filters"
        >

          <div class="filter-panel-heading">

            <div>

              <p class="section-kicker">
                EXPLORE THE RECORD BOOK
              </p>

              <h2 class="filter-title">
                Find Top Times
              </h2>

            </div>

          </div>


          <form
            id="filter-form"
            autocomplete="off"
          >

            <div class="form-row">


              <!-- COURSE -->

              <div class="form-group">

                <label for="course">
                  Course
                </label>

                <select
                  id="course"
                  name="course"
                  aria-label="Course"
                ></select>

              </div>


              <!-- CATEGORY -->

              <div class="form-group">

                <label for="gender">
                  Category
                </label>

                <select
                  id="gender"
                  name="gender"
                  aria-label="Category"
                ></select>

              </div>


              <!-- AGE GROUP -->

              <div class="form-group">

                <label for="age_group_desc">
                  Age Group
                </label>

                <select
                  id="age_group_desc"
                  name="age_group_desc"
                  aria-label="Age Group"
                ></select>

              </div>


              <!-- EVENT -->

              <div class="form-group">

                <label for="event">
                  Event
                </label>

                <select
                  id="event"
                  name="event"
                  aria-label="Event"
                ></select>

              </div>


            </div>

          </form>

        </section>


        <!-- =================================================
             RESULTS HEADER
             ================================================= -->

        <section
          class="results-section"
          aria-labelledby="results-title"
        >

          <div class="results-heading">

            <p class="section-kicker">
              ALL-TIME PERFORMANCE
            </p>

            <h2 id="results-title">
              Top 10
            </h2>

            <p
              id="results-subtitle"
              aria-live="polite"
            ></p>

          </div>


          <!-- =================================================
               RESULTS

               DESKTOP:
                 Traditional 5-column table.

               TABLET:
                 Compact table.

               MOBILE:
                 CSS transforms each <tr> into a vertical
                 result card. The same HTML/data is used.
               ================================================= -->

          <div class="table-wrap">

            <table
              class="results-table"
              aria-label="Hanover Aquatics All-Time Top 10 Swim Times"
            >

              <thead>

                <tr>

                  <th
                    scope="col"
                    class="rank-column"
                  >
                    Rank
                  </th>

                  <th
                    scope="col"
                    class="name-column"
                  >
                    Name
                  </th>

                  <th
                    scope="col"
                    class="time-column"
                  >
                    Swim Time
                  </th>

                  <th
                    scope="col"
                    class="date-column"
                  >
                    Date
                  </th>

                  <th
                    scope="col"
                    class="meet-column"
                  >
                    Meet
                  </th>

                </tr>

              </thead>


              <tbody id="results-table">

                <tr class="show loading-row">

                  <td
                    colspan="5"
                    class="table-status"
                  >
                    Loading…
                  </td>

                </tr>

              </tbody>

            </table>

          </div>

        </section>


        <!-- =================================================
             NO JAVASCRIPT FALLBACK
             ================================================= -->

        <noscript>

          <p class="status-message">

            This page requires JavaScript enabled
            to display Hanover Aquatics Top 10 results.

          </p>

        </noscript>


      </div>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer>

      <div class="footer-inner">

        <strong>
          Hanover Aquatics
        </strong>

        <span class="footer-divider">
          •
        </span>

        <span>
          All-Time Top 10
        </span>

      </div>

    </footer>


  </div>


  <!-- =======================================================
       TOP 10 DASHBOARD
       ======================================================= -->

  <script
    src="top10_dashboard.js?v=6"
    defer
  ></script>


</body>

</html>
